# テスト・パッケージ作成と、タグ(v2.0.0 など)を push したときの nuget.org への公開
# 公開は nuget.org の Trusted Publishing(このファイル名 build.yml を登録する)を使う
name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # ドキュメントなどビルドに関係しないファイルだけの変更では、test と pack をスキップする。
  # paths-ignore でワークフローごと止めると必須チェックが報告されず PR をマージできなくなるため、
  # ワークフローは常に動かし、最後の build-result ジョブ(ルールセットの必須チェック)で結果をまとめる
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: ビルドに関係する変更があるか
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # ビルドに関係しないファイル(これ以外が1つでも変わっていればビルドする)
          ignore='(\.md$|^LICENSE$|^\.claude/|^\.github/dependabot\.yml$)'
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # タグは公開するので常にビルドする
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          elif [[ "$EVENT_NAME" == pull_request ]]; then
            files=$(git diff --name-only "$PR_BASE...$PR_HEAD")
          elif [[ -n "$PUSH_BEFORE" && ! "$PUSH_BEFORE" =~ ^0+$ ]] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$PUSH_BEFORE" "$GITHUB_SHA")
          else
            # 比較元が分からない場合はビルドする
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$files"
          if [[ -n "$files" ]] && ! grep -qvE "$ignore" <<< "$files"; then
            echo "ビルドに関係する変更はないため、test と pack をスキップする"
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    # コアは netstandard2.0 と net8.0 で処理が異なる(#if NET8_0_OR_GREATER)ため、両方のビルドをテストする
    name: test (${{ matrix.os }}, ${{ matrix.core }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        core: [net8.0, netstandard2.0]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: テスト
        run: dotnet test -p:CoreTargetFramework=${{ matrix.core }}

  pack:
    needs: test
    # test がスキップされると pack もスキップされる
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: バージョン
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "args=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # タグ以外は Directory.Build.props の VersionPrefix のプレリリース版(公開はしない)
            # 0.0.0 などにすると、公開済みバージョンとの API 互換性の確認でエラー(CP0003)になる
            echo "args=-p:VersionSuffix=ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
      - name: パッケージ作成
        run: dotnet pack ZipConvertCustomerBarCode.sln -c Release -o artifacts ${{ steps.version.outputs.args }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: packages
          path: artifacts/

  # ルールセットの必須チェック。test・pack のどれかが失敗・キャンセルされたら失敗、
  # すべて成功またはスキップ(ドキュメントだけの変更)なら成功する
  build-result:
    if: always()
    needs: [changes, test, pack]
    runs-on: ubuntu-latest
    steps:
      - name: 結果の確認
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pack
    runs-on: ubuntu-latest
    # release Environment: v* タグのみ・承認後に実行。nuget.org の Trusted Publishing のポリシーもこの Environment に限定している
    environment: release
    permissions:
      id-token: write  # Trusted Publishing の短期間の API キーを取得するため
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: packages
          path: artifacts
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: NuGet ログイン(Trusted Publishing)
        id: login
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}  # release Environment の Secret。nuget.org のユーザー名(プロフィール名。メールアドレスではない)
      - name: nuget.org に公開
        # .snupkg(シンボルパッケージ)は同じフォルダーにあれば一緒に公開される
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  # nuget.org に公開したあと、タグの GitHub Release を作る(リリースノートはマージした PR から自動生成)
  # 書き込み権限は、Trusted Publishing を扱う publish ジョブとは分けてこのジョブだけに付ける
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: GitHub Release の作成
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # v2.1.0-beta.1 のような - を含むタグはプレリリースにする
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "${prerelease[@]}"
