# テスト・パッケージ作成と、タグ(v2.0.0 など)を push したときの nuget.org への公開
# 公開は nuget.org の Trusted Publishing(このファイル名 build.yml を登録する)を使う
name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    # コアは netstandard2.0 と net8.0 で処理が異なる(#if NET8_0_OR_GREATER)ため、両方のビルドをテストする
    name: test (${{ matrix.os }}, ${{ matrix.core }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        core: [net8.0, netstandard2.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: テスト
        run: dotnet test -p:CoreTargetFramework=${{ matrix.core }}

  pack:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: バージョン
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # タグ以外はプレリリース版(公開はしない)
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
      - name: パッケージ作成
        run: dotnet pack ZipConvertCustomerBarCode.sln -c Release -o artifacts -p:Version=${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pack
    runs-on: ubuntu-latest
    # release Environment: v* タグのみ・承認後に実行。nuget.org の Trusted Publishing のポリシーもこの Environment に限定している
    environment: release
    permissions:
      id-token: write  # Trusted Publishing の短期間の API キーを取得するため
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: NuGet ログイン(Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}  # release Environment の Secret。nuget.org のユーザー名(プロフィール名。メールアドレスではない)
      - name: nuget.org に公開
        # .snupkg(シンボルパッケージ)は同じフォルダーにあれば一緒に公開される
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
